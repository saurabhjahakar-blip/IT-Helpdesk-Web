{% extends "base.html" %}

{% block content %}
<section class="section-page">
    <h2>System Tools</h2>
    <p>Launch core Windows utilities for hardware and process diagnostics.</p>
    <div class="tool-grid">
        <button type="button" class="tool-tile" data-tool="system_info" data-testid="system-tool-system_info">
            <i class="bi bi-info-circle"></i>
            <strong>System Information</strong>
            <small>msinfo32 — full hardware report</small>
        </button>
        <button type="button" class="tool-tile" data-tool="device_manager" data-testid="system-tool-device_manager">
            <i class="bi bi-usb-symbol"></i>
            <strong>Device Manager</strong>
            <small>View drivers and devices — changes require admin</small>
        </button>
        <button type="button" class="tool-tile" data-tool="event_viewer" data-testid="system-tool-event_viewer">
            <i class="bi bi-journal-text"></i>
            <strong>Event Viewer</strong>
            <small>Browse Windows event logs</small>
        </button>
        <button type="button" class="tool-tile" data-tool="task_manager" data-testid="system-tool-task_manager">
            <i class="bi bi-list-task"></i>
            <strong>Task Manager</strong>
            <small>Processes, performance, startup</small>
        </button>
        <button type="button" class="tool-tile" data-tool="services" data-testid="system-tool-services">
            <i class="bi bi-gear-wide-connected"></i>
            <strong>Services</strong>
            <small>View services — start/stop requires admin</small>
        </button>
        <button type="button" class="tool-tile" data-tool="cmd" data-testid="system-tool-cmd">
            <i class="bi bi-terminal"></i>
            <strong>Command Prompt</strong>
            <small>Open a local shell (your own permissions, not elevated)</small>
        </button>
    </div>
</section>

<section class="console-panel" style="margin-top:16px;" data-testid="system-console-panel">
    <div class="console-head">
        <h2>Output / Console</h2>
        <div class="console-actions">
            <button type="button" class="ghost-btn" id="console-clear" data-testid="system-console-clear-btn">Clear</button>
            <button type="button" class="primary-btn" id="console-copy" data-testid="system-console-copy-btn">Copy</button>
            <button type="button" class="success-btn" id="console-save" data-testid="system-console-save-btn">Save</button>
        </div>
    </div>
    <pre class="console-body" id="console-output" data-testid="system-console-output"></pre>
</section>
{% endblock %}
