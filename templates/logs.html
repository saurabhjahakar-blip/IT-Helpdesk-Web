{% extends "base.html" %}

{% block content %}
<section class="section-page">
    <h2>Logs & Diagnostics</h2>
    <p>Pull recent Windows event log entries into the console, or open Reliability Monitor.</p>
    <div class="tool-grid">
        <button type="button" class="tool-tile" data-tool="system_logs" data-testid="logs-tool-system_logs">
            <i class="bi bi-file-earmark-text"></i>
            <strong>System Logs</strong>
            <small>Last 15 System events</small>
        </button>
        <button type="button" class="tool-tile" data-tool="network_logs" data-testid="logs-tool-network_logs">
            <i class="bi bi-hdd-network"></i>
            <strong>Network Logs</strong>
            <small>Network profile / related events</small>
        </button>
        <button type="button" class="tool-tile" data-tool="performance_logs" data-testid="logs-tool-performance_logs">
            <i class="bi bi-graph-up"></i>
            <strong>Performance Logs</strong>
            <small>Diagnostics-Performance events</small>
        </button>
        <button type="button" class="tool-tile" data-tool="reliability_monitor" data-testid="logs-tool-reliability_monitor">
            <i class="bi bi-heart-pulse"></i>
            <strong>Reliability Monitor</strong>
            <small>Open perfmon /rel</small>
        </button>
        <button type="button" class="tool-tile" data-tool="performance_monitor" data-testid="logs-tool-performance_monitor">
            <i class="bi bi-speedometer"></i>
            <strong>Performance Monitor</strong>
            <small>Open perfmon.exe</small>
        </button>
        <button type="button" class="tool-tile" data-tool="resource_monitor" data-testid="logs-tool-resource_monitor">
            <i class="bi bi-cpu"></i>
            <strong>Resource Monitor</strong>
            <small>Open resmon.exe</small>
        </button>
    </div>
</section>

<section class="console-panel" style="margin-top:16px;" data-testid="logs-console-panel">
    <div class="console-head">
        <h2>Output / Console</h2>
        <div class="console-actions">
            <button type="button" class="ghost-btn" id="console-clear" data-testid="logs-console-clear-btn">Clear</button>
            <button type="button" class="primary-btn" id="console-copy" data-testid="logs-console-copy-btn">Copy</button>
            <button type="button" class="success-btn" id="console-save" data-testid="logs-console-save-btn">Save</button>
        </div>
    </div>
    <pre class="console-body" id="console-output" data-testid="logs-console-output"></pre>
</section>
{% endblock %}
